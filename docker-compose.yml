services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - BASE_URL=http://localhost:3000
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data:
